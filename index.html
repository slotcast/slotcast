<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Slotcast</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1D2328;--muted:#4A545C;--soft:#6F7980;--bg:#F3F4F2;--card:#fff;--dark:#26323A;--acc:#E0692C;--line:#DCE3E7}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.45}
header{background:var(--dark);color:#F3F4F2;padding:12px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.logo{font-family:'Space Grotesk',Arial,sans-serif;font-size:24px;font-weight:700}.logo span{color:var(--acc)}
.who{font-size:13px;color:#BFC9CF;display:flex;gap:12px;align-items:center}
.who button{background:none;border:1px solid #5A6870;color:#F3F4F2;border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer}
nav{display:flex;gap:8px;flex-wrap:wrap;max-width:1100px;margin:0 auto;padding:14px 20px 0}
nav button{background:#fff;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:9px 14px;font:inherit;cursor:pointer}
nav button.on{background:var(--dark);color:#F3F4F2;border-color:var(--dark);font-weight:600}
nav .n{display:inline-block;min-width:20px;margin-left:6px;padding:0 6px;border-radius:10px;background:var(--acc);color:var(--ink);font-size:12px;font-weight:700}
main{max-width:1100px;margin:0 auto;padding:10px 20px 60px}
h1,h2,h3{font-family:'Space Grotesk',Arial,sans-serif;font-weight:600;margin:0}
h1{font-size:26px;margin-top:10px}h2{font-size:20px}h3{font-size:17px}
.card{background:var(--card);border-radius:12px;padding:20px;margin:14px 0}
.narrow{max-width:520px;margin:30px auto}
.dark{background:var(--dark);color:#F3F4F2}
.row{display:flex;flex-wrap:wrap;gap:12px}.row>div{flex:1 1 160px;min-width:0}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}
input,select,textarea{width:100%;padding:10px;border:1px solid #C9CFD3;border-radius:8px;font:inherit;background:#fff;color:var(--ink)}
input[type=checkbox],input[type=radio]{width:auto;margin-right:6px}
.chk{display:inline-flex;align-items:center;margin:4px 14px 4px 0;font-weight:500;color:var(--ink);font-size:14px}
.btn{background:var(--acc);color:var(--ink);border:0;border-radius:8px;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer}
.btn2{background:var(--dark);color:#F3F4F2;border:0;border-radius:8px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
.lnk{background:none;border:0;color:#B04E19;font:inherit;font-weight:600;cursor:pointer;padding:6px 0}
button:disabled{opacity:.5;cursor:not-allowed}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--muted);padding:8px 6px;border-bottom:2px solid var(--dark);white-space:nowrap}
td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.num{text-align:right;white-space:nowrap}
.sub{font-size:13px;color:var(--soft)}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:3px 8px;background:#E9EBE8;color:var(--muted)}
.tag.ok{background:#E3F1E7;color:#1F6B3A}.tag.dev{background:#FBE7DC;color:#8A3A12}.tag.acc{background:var(--acc);color:var(--ink)}
.note{border-left:4px solid var(--acc);padding:4px 0 4px 14px;color:var(--muted);margin:10px 0}
.err{color:#A3261B;font-size:13px;margin-top:6px}.ok{color:#1F6B3A;font-size:13px;margin-top:6px}
.hint{font-size:13px;margin-top:6px;color:#1F6B3A}.hint.no{color:var(--soft)}
.line{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.scroll{overflow-x:auto}
.banner{background:#FFF4EC;border:1px solid #F2C8AE;border-radius:10px;padding:10px 14px;margin:12px 0;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tabs{display:flex;gap:6px;margin-bottom:14px}.tabs button{flex:1;background:#E9EBE8;border:0;border-radius:8px;padding:9px;font:inherit;cursor:pointer;color:var(--muted)}.tabs button.on{background:var(--dark);color:#fff;font-weight:600}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.stat div{background:#F7F8F6;border-radius:10px;padding:12px}.stat b{display:block;font-size:24px;font-family:'Space Grotesk',Arial}
main.full{max-width:none;padding:0}
nav:empty{display:none}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
.blk{padding:44px 20px}
.hero{background:var(--dark);color:#F3F4F2;padding:48px 0 56px}
.hero-in{display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start}
.hero-txt{flex:1 1 440px;min-width:0}.hero-auth{flex:1 1 380px;min-width:0;max-width:480px;scroll-margin-top:20px;color:var(--ink)}
.kick{margin:0 0 10px;font-size:13px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--acc)}
.big{font-size:44px;line-height:1.08;margin:0 0 18px}
.lead{font-size:18px;line-height:1.55;color:#DCE3E7;margin:0 0 16px}.free{color:#BFC9CF;font-size:15px;margin:0}
.h2{font-size:30px;line-height:1.15;margin:0 0 14px}.h3{font-size:22px;margin:0 0 10px}.h4{font-size:17px;margin:6px 0}
.lead2{font-size:17px;color:var(--muted);max-width:720px;margin:0 0 18px}
.two{display:flex;flex-wrap:wrap;gap:20px}.two>div{flex:1 1 400px;min-width:0}
.pane{background:#fff;border-radius:14px;padding:28px;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.pane p,.pane li{font-size:16px;line-height:1.6;color:var(--muted)}.pane .kick{color:var(--acc)}
.pane.dark{background:var(--dark);color:#F3F4F2}.pane.dark li{color:#DCE3E7}.pane ul{margin:0 0 14px;padding-left:20px}.pane ol{margin:4px 0 10px;padding-left:20px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.steps>div{background:#fff;border-radius:12px;padding:20px}
.steps b{font-family:'Space Grotesk',Arial;font-size:30px;color:var(--acc)}.steps p{margin:0;color:var(--muted)}
.nums{display:flex;flex-direction:column;gap:12px}.nums>div{background:#fff;border-radius:12px;padding:18px 22px}
.nums b{display:block;font-family:'Space Grotesk',Arial;font-size:32px;color:var(--dark)}.nums span{color:var(--muted)}
.cta{background:var(--acc);padding:40px 0}.cta-in{display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:space-between}
.cta-in>div:first-child{flex:1 1 460px}.cta p{font-size:17px;margin:0}.cta-b{display:flex;flex-wrap:wrap;gap:12px}
.btn2,.btn3{padding:13px 18px}.btn3{background:#F3F4F2;color:var(--ink);border:0;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
.faq details{background:#fff;border-radius:10px;padding:16px 20px;margin:10px 0}.faq summary{font-weight:600;cursor:pointer;font-size:16px}.faq p{color:var(--muted);margin:10px 0 0}
.foot{background:var(--dark);color:#BFC9CF;padding:28px 0}.foot-in{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center}.foot a{color:#F3F4F2}
.policy{max-width:820px}.policy h2{margin-top:22px}.policy li,.policy p{line-height:1.6}
@media(max-width:600px){.big{font-size:32px}.h2{font-size:24px}.blk{padding:32px 16px}}
</style>
</head>
<body>
<header><div class="logo">slot<span>cast</span></div><div class="who" id="who"></div></header>
<nav id="nav"></nav>
<main id="app"><div class="card">Laddar…</div></main>
<script type="module" src="app.js"></script>
</body>
</html>
